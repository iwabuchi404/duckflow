<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            border: 3px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            background: #000;
        }
        .info-panel {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            font-size: 18px;
        }
        .info-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #00d4ff;
        }
        .controls {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff0055;
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
        <div class="info-panel">
            <div class="info-box">Score: <span id="score">0</span></div>
            <div class="info-box">Level: <span id="level">1</span></div>
            <div class="info-box">Lines: <span id="lines">0</span></div>
        </div>
        <div class="controls">
            ← → : Move | ↑ : Rotate | ↓ : Soft Drop | Space : Hard Drop | P : Pause | R : Restart
        </div>
        <div id="gameOver" class="game-over">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Press R to restart</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const BLOCK_SIZE = 30;
        const COLS = 10;
        const ROWS = 20;

        // Tetromino shapes and colors
        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1],[1,1]], // O
            [[0,1,0],[1,1,1]], // T
            [[1,0,0],[1,1,1]], // J
            [[0,0,1],[1,1,1]], // L
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]]  // Z
        ];

        const COLORS = [
            '#00ffff', // I - cyan
            '#ffff00', // O - yellow
            '#aa00ff', // T - purple
            '#0000ff', // J - blue
            '#ff7f00', // L - orange
            '#00ff00', // S - green
            '#ff0000'  // Z - red
        ];

        let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        let currentPiece = null;
        let currentX = 0;
        let currentY = 0;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let isPaused = false;
        let dropInterval = 1000;
        let lastDropTime = 0;

        function createPiece() {
            const type = Math.floor(Math.random() * SHAPES.length);
            return {
                shape: SHAPES[type],
                color: COLORS[type],
                type: type
            };
        }

        function rotatePiece(piece) {
            const rows = piece.shape.length;
            const cols = piece.shape[0].length;
            const rotated = Array.from({length: cols}, () => Array(rows).fill(0));
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    rotated[c][rows - 1 - r] = piece.shape[r][c];
                }
            }
            return rotated;
        }

        function collision(piece, x, y) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        const newX = x + c;
                        const newY = y + r;
                        
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function mergePiece() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        const y = currentY + r;
                        const x = currentX + c;
                        if (y >= 0) {
                            board[y][x] = currentPiece.type + 1;
                        }
                    }
                }
            }
        }

        function clearLines() {
            let linesCleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    r++;
                }
            }
            
            if (linesCleared > 0) {
                const points = [0, 100, 300, 500, 800];
                score += points[linesCleared] * level;
                lines += linesCleared;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);
                updateDisplay();
            }
        }

        function newPiece() {
            currentPiece = createPiece();
            currentX = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentY = 0;
            
            if (collision(currentPiece, currentX, currentY)) {
                gameOver = true;
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('finalScore').textContent = score;
            }
        }

        function dropPiece() {
            if (!collision(currentPiece, currentX, currentY + 1)) {
                currentY++;
            } else {
                mergePiece();
                clearLines();
                newPiece();
            }
        }

        function hardDrop() {
            while (!collision(currentPiece, currentX, currentY + 1)) {
                currentY++;
                score += 2;
            }
            dropPiece();
            updateDisplay();
        }

        function movePiece(dx) {
            if (!collision(currentPiece, currentX + dx, currentY)) {
                currentX += dx;
            }
        }

        function rotateCurrentPiece() {
            const rotated = rotatePiece(currentPiece);
            const originalShape = currentPiece.shape;
            currentPiece.shape = rotated;
            
            // Wall kick
            let kick = 0;
            while (collision(currentPiece, currentX, currentY)) {
                currentX += 1;
                kick++;
                if (kick > 2) {
                    currentX -= 3;
                    while (collision(currentPiece, currentX, currentY) && kick > 0) {
                        currentX -= 1;
                        kick--;
                    }
                    if (collision(currentPiece, currentX, currentY)) {
                        currentPiece.shape = originalShape;
                        currentX += kick;
                    }
                    break;
                }
            }
        }

        function drawBlock(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            
            // Inner highlight
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(x * BLOCK_SIZE + 2, y * BLOCK_SIZE + 2, BLOCK_SIZE - 4, BLOCK_SIZE / 2);
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw board
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c]) {
                        drawBlock(c, r, COLORS[board[r][c] - 1]);
                    }
                }
            }
            
            // Draw current piece
            if (currentPiece) {
                for (let r = 0; r < currentPiece.shape.length; r++) {
                    for (let c = 0; c < currentPiece.shape[r].length; c++) {
                        if (currentPiece.shape[r][c]) {
                            drawBlock(currentX + c, currentY + r, currentPiece.color);
                        }
                    }
                }
            }
            
            // Draw grid
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * BLOCK_SIZE, 0);
                ctx.lineTo(c * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * BLOCK_SIZE);
                ctx.lineTo(canvas.width, r * BLOCK_SIZE);
                ctx.stroke();
            }
        }

        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        function gameLoop(timestamp) {
            if (!gameOver && !isPaused) {
                if (timestamp - lastDropTime > dropInterval) {
                    dropPiece();
                    lastDropTime = timestamp;
                }
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        function restart() {
            board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            score = 0;
            level = 1;
            lines = 0;
            gameOver = false;
            isPaused = false;
            dropInterval = 1000;
            updateDisplay();
            document.getElementById('gameOver').style.display = 'none';
            newPiece();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (gameOver && e.key.toLowerCase() === 'r') {
                restart();
                return;
            }
            
            if (e.key.toLowerCase() === 'p') {
                isPaused = !isPaused;
                return;
            }
            
            if (isPaused || gameOver) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    movePiece(-1);
                    break;
                case 'ArrowRight':
                    movePiece(1);
                    break;
                case 'ArrowDown':
                    dropPiece();
                    score += 1;
                    updateDisplay();
                    break;
                case 'ArrowUp':
                    rotateCurrentPiece();
                    break;
                case ' ':
                    hardDrop();
                    break;
            }
        });

        // Start game
        restart();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
