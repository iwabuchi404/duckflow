id: complete-no-question
task: "sales.csv の売上データのうち、appleとcherryの2商品だけを集計し、report.json に出力してください（bananaは不要です）。report.json のトップレベルに商品名をキー、合計金額を値とする形式で出力してください（例: {\"apple\": 300}）。summary 等の階層で包まないでください。"
fixture: fixtures/ambiguous_ws
max_loops: 15
timeout_seconds: 420
expects_question: false
checks:
  - type: file_exists
    path: report.json
  - type: file_contains
    path: report.json
    text: "apple"
  - type: file_contains
    path: report.json
    text: "cherry"
  - type: file_not_contains
    path: report.json
    text: "banana"
verify_command: "{python} -c \"import json; d=json.load(open('report.json')); assert d.get('apple')==300 and d.get('cherry')==500 and 'banana' not in d and 'summary' not in d and 'report' not in d and 'products' not in d and 'sales_report' not in d, d\""
