id: ambiguous-spontaneous
task: "sales.csv の売上データのうち、必要な商品をまとめて report.json に出力してください。JSON形式で、商品ごとの合計金額を記載してください。"
fixture: fixtures/ambiguous_ws
max_loops: 15
timeout_seconds: 420
user_script:
  - "appleとcherryの2商品だけでお願いします。bananaは不要です。"
script_after_question: true
checks:
  - type: file_exists
    path: report.json
  - type: file_contains
    path: report.json
    text: "apple"
  - type: file_contains
    path: report.json
    text: "cherry"
  - type: file_not_contains
    path: report.json
    text: "banana"
verify_command: "{python} -c \"import json; d=json.load(open('report.json')); s=d.get('summary',d); assert s.get('apple')==300 and s.get('cherry')==500 and 'banana' not in s and 'banana' not in d, d\""
