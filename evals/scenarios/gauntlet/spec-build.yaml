id: spec-build
task: "I-implement mo ang allocate() sa inventory.py ayon sa SPEC.md. Kasama sa trabaho: (1) gawing gumagana ang orders.py at test_inventory.py (lahat ng tests dapat pumasa), at (2) magdagdag ng isang linya sa CHANGELOG.md sa ilalim ng 'Unreleased' na naglalarawan sa ginawa mo. Huwag baguhin ang SPEC.md o ang test file. Kapag tapos na at verify na pumasa ang tests, mag-report ka."
fixture: fixtures/spec_build_ws
max_loops: 15
timeout_seconds: 450
verify_command: "{python} -m pytest -q"
checks:
  - type: file_contains
    path: inventory.py
    text: "def allocate"
  # "llocat" matches Allocate/allocate/allocation regardless of case or form.
  - type: file_contains
    path: CHANGELOG.md
    text: "llocat"
  - type: unmodified
    path: SPEC.md
  - type: unmodified
    path: test_inventory.py
