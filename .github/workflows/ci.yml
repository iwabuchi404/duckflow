name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Verify clean imports
        run: uv run --frozen python -X utf8 -c "import main; import companion.base.llm_client; import companion.task_management"
      - name: Run tests
        run: uv run --frozen pytest tests/ -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Run Ruff
        run: uv run --frozen ruff check companion/
      - name: Check Black formatting
        run: uv run --frozen black --check companion/
      - name: Run mypy
        run: uv run --frozen mypy companion/
